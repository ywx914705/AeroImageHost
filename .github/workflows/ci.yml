name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build app image (Drogon + miniocpp + AeroImageHost)
        env:
          MYSQL_ROOT_PASSWORD: ci_test_root
          MYSQL_PASSWORD: ci_test_mysql
          MINIO_ROOT_PASSWORD: ci_test_minio
          REDIS_PASSWORD: ci_test_redis
        run: docker compose build app
