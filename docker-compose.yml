services:
  nginx:
    image: nginx:alpine
    container_name: aeroimagehost-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  app:
    build: .
    container_name: aeroimagehost-app
    restart: unless-stopped
    expose:
      - "8082"
    volumes:
      - aeroimagehost-logs:/app/logs
      - ./config/config-docker.json:/app/config.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  db:
    image: mysql:8.0
    container_name: aeroimagehost-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-imagehost}
      MYSQL_USER: ${MYSQL_USER:-aero_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - aeroimagehost-db:/var/lib/mysql
      - ./schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 10s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: aeroimagehost-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - aeroimagehost-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  minio:
    image: minio/minio:latest
    container_name: aeroimagehost-minio
    restart: unless-stopped
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - aeroimagehost-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 10s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  minio-client:
    image: minio/mc
    container_name: aeroimagehost-minio-client
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD}
        mc mb myminio/images --region us-east-1
        mc anonymous set download myminio/images

volumes:
  aeroimagehost-db:
  aeroimagehost-minio:
  aeroimagehost-logs:

networks:
  default:
    name: aeroimagehost-network
    driver: bridge
