<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroImageHost · 文件分类 Tab 预览</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #ffffff;
    --bg-secondary: #f7f8fa;
    --bg-card: #ffffff;
    --text-primary: #1a1a2e;
    --text-secondary: #4e5969;
    --text-tertiary: #86909c;
    --border-subtle: #e5e6eb;
    --border-card: #e5e6eb;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 6px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --accent: #2563eb;
    --accent-light: rgba(37, 99, 235, 0.06);
    --accent-border: rgba(37, 99, 235, 0.15);
    --thumb-bg: #f2f3f5;
    --input-bg: #f7f8fa;
}
[data-theme="dark"] {
    --bg-primary: #17171a;
    --bg-secondary: #232324;
    --bg-card: #2a2a2d;
    --text-primary: #e8e8ed;
    --text-secondary: #a6a6b3;
    --text-tertiary: #6b6b80;
    --border-subtle: #3a3a3d;
    --border-card: #3a3a3d;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
    --accent: #60a5fa;
    --accent-light: rgba(96, 165, 250, 0.1);
    --accent-border: rgba(96, 165, 250, 0.2);
    --thumb-bg: #2a2a2d;
    --input-bg: #232324;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-secondary);
    color: var(--text-primary);
    min-height: 100vh;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px;
}
h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text-primary);
}
.subtitle {
    font-size: 0.9rem;
    color: var(--text-tertiary);
    margin-bottom: 32px;
}

/* 搜索栏 */
.search-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}
.search-container {
    flex: 1;
    position: relative;
}
.search-container i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    font-size: 0.85rem;
}
.search-input {
    width: 100%;
    padding: 10px 14px 10px 40px;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
}
.search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
}
.search-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.search-btn:hover { opacity: 0.9; }

/* ========== 分类 Tab 栏 ========== */
.type-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 20px;
    padding: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
.type-tabs::-webkit-scrollbar { height: 0; }

.type-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
    position: relative;
}
.type-tab:hover {
    background: var(--accent-light);
    color: var(--text-primary);
}
.type-tab.active {
    background: var(--accent-light);
    font-weight: 600;
}
.type-tab .tab-icon {
    font-size: 0.9rem;
    width: 18px;
    text-align: center;
}
.type-tab .tab-label {
    transition: color 0.25s;
}
.type-tab .tab-count {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 10px;
    background: var(--bg-secondary);
    color: var(--text-tertiary);
    transition: all 0.25s;
}
.type-tab.active .tab-count {
    color: white;
}

/* 各分类激活态颜色 */
.type-tab[data-type="all"].active {
    color: var(--accent);
}
.type-tab[data-type="all"].active .tab-count {
    background: var(--accent);
}

.type-tab[data-type="image"].active {
    color: #2563eb;
}
.type-tab[data-type="image"].active .tab-count {
    background: #2563eb;
}
.type-tab[data-type="image"].active .tab-icon {
    color: #2563eb;
}

.type-tab[data-type="document"].active {
    color: #f59e0b;
}
.type-tab[data-type="document"].active .tab-count {
    background: #f59e0b;
}
.type-tab[data-type="document"].active .tab-icon {
    color: #f59e0b;
}

.type-tab[data-type="video"].active {
    color: #8b5cf6;
}
.type-tab[data-type="video"].active .tab-count {
    background: #8b5cf6;
}
.type-tab[data-type="video"].active .tab-icon {
    color: #8b5cf6;
}

.type-tab[data-type="audio"].active {
    color: #ec4899;
}
.type-tab[data-type="audio"].active .tab-count {
    background: #ec4899;
}
.type-tab[data-type="audio"].active .tab-icon {
    color: #ec4899;
}

.type-tab[data-type="other"].active {
    color: #64748b;
}
.type-tab[data-type="other"].active .tab-count {
    background: #64748b;
}
.type-tab[data-type="other"].active .tab-icon {
    color: #64748b;
}

/* ========== 文件网格 ========== */
.file-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
}
.file-card {
    background: var(--bg-card);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border-subtle);
    border-top: 3px solid var(--accent);
    transition: all 0.25s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
}
.file-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-border);
    box-shadow: var(--shadow-md);
}
.file-thumb {
    height: 140px;
    background: var(--thumb-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}
.file-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}
.file-card:hover .file-thumb img {
    transform: scale(1.05);
}
.file-icon-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    position: relative;
    background: linear-gradient(135deg, var(--thumb-bg) 0%, var(--bg-secondary) 100%);
}
.file-icon-large {
    font-size: 2rem;
    margin-bottom: 4px;
}
.file-extension-tag {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(6px);
    color: white;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}
.file-info {
    padding: 1rem 1.1rem;
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    flex: 1;
}
.file-name {
    font-weight: 600;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 0.85rem;
    line-height: 1.4;
}
.file-meta {
    font-size: 0.75rem;
    color: var(--text-tertiary);
    margin: 4px 0 8px;
}
.file-actions {
    display: flex;
    gap: 4px;
    border-top: 1px solid var(--border-subtle);
    padding-top: 8px;
    margin-top: auto;
}
.action-btn {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    white-space: nowrap;
    font-family: inherit;
}
.action-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
}
.action-btn.danger:hover {
    background: rgba(239, 68, 68, 0.06);
    color: #ef4444;
    border-color: rgba(239, 68, 68, 0.2);
}

/* 主题切换 */
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: all 0.2s;
    z-index: 100;
    box-shadow: var(--shadow-sm);
}
.theme-toggle:hover {
    border-color: var(--accent-border);
    color: var(--accent);
}

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-tertiary);
}
.empty-state i {
    font-size: 3rem;
    margin-bottom: 16px;
    opacity: 0.4;
}

/* 分页 */
.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding: 16px 0;
}
.page-btn {
    min-width: 36px;
    height: 36px;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
}
.page-btn:hover { border-color: var(--accent-border); color: var(--accent); }
.page-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

/* 响应式 */
@media (max-width: 768px) {
    .file-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .type-tabs { gap: 2px; padding: 4px; }
    .type-tab { padding: 6px 10px; font-size: 0.8rem; }
    .type-tab .tab-count { font-size: 0.65rem; padding: 1px 5px; }
}

/* 提示标签 */
.preview-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    background: linear-gradient(135deg, #f59e0b, #f97316);
    color: white;
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 20px;
}
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="切换明暗主题">
    <i class="fas fa-moon" id="themeIcon"></i>
</button>

<div class="container">
    <div class="preview-badge"><i class="fas fa-eye"></i> UI 预览 · 非正式页面</div>
    <h1>文件管理</h1>
    <p class="subtitle">点击下方分类 Tab 查看筛选效果，右上角可切换明暗主题</p>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" class="search-input" placeholder="搜索文件名...">
        </div>
        <button class="search-btn"><i class="fas fa-search"></i> 搜索</button>
    </div>

    <!-- 分类 Tab 栏 -->
    <div class="type-tabs" id="typeTabs">
        <button class="type-tab active" data-type="all" onclick="switchTab('all')">
            <i class="fas fa-th-large tab-icon"></i>
            <span class="tab-label">全部</span>
            <span class="tab-count">42</span>
        </button>
        <button class="type-tab" data-type="image" onclick="switchTab('image')">
            <i class="fas fa-image tab-icon"></i>
            <span class="tab-label">图片</span>
            <span class="tab-count">28</span>
        </button>
        <button class="type-tab" data-type="document" onclick="switchTab('document')">
            <i class="fas fa-file-alt tab-icon"></i>
            <span class="tab-label">文档</span>
            <span class="tab-count">8</span>
        </button>
        <button class="type-tab" data-type="video" onclick="switchTab('video')">
            <i class="fas fa-video tab-icon"></i>
            <span class="tab-label">视频</span>
            <span class="tab-count">3</span>
        </button>
        <button class="type-tab" data-type="audio" onclick="switchTab('audio')">
            <i class="fas fa-music tab-icon"></i>
            <span class="tab-label">音频</span>
            <span class="tab-count">1</span>
        </button>
        <button class="type-tab" data-type="other" onclick="switchTab('other')">
            <i class="fas fa-box tab-icon"></i>
            <span class="tab-label">其他</span>
            <span class="tab-count">2</span>
        </button>
    </div>

    <!-- 文件网格 -->
    <div class="file-grid" id="fileGrid"></div>

    <!-- 分页 -->
    <div class="pagination">
        <button class="page-btn"><i class="fas fa-chevron-left"></i></button>
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<script>
const FILES = {
    all: [
        { name: 'screenshot_2026.png', ext: '.png', icon: 'fa-image', color: '#2563eb', size: '2.4 MB', date: '2026-05-28', isImage: true, imgSeed: 'aero1' },
        { name: '项目架构图.jpg', ext: '.jpg', icon: 'fa-image', color: '#2563eb', size: '1.8 MB', date: '2026-05-27', isImage: true, imgSeed: 'aero2' },
        { name: 'WebServer项目.pdf', ext: '.pdf', icon: 'fa-file-pdf', color: '#ef4444', size: '3.2 MB', date: '2026-05-27', isImage: false },
        { name: 'banner_design.png', ext: '.png', icon: 'fa-image', color: '#2563eb', size: '856 KB', date: '2026-05-26', isImage: true, imgSeed: 'aero3' },
        { name: '第一次上机报告.doc', ext: '.doc', icon: 'fa-file-word', color: '#0ea5e9', size: '1.2 MB', date: '2026-05-26', isImage: false },
        { name: 'demo_video.mp4', ext: '.mp4', icon: 'fa-file-video', color: '#8b5cf6', size: '45.6 MB', date: '2026-05-25', isImage: false },
        { name: 'avatar.png', ext: '.png', icon: 'fa-image', color: '#2563eb', size: '320 KB', date: '2026-05-25', isImage: true, imgSeed: 'aero4' },
        { name: '数据分析报表.xlsx', ext: '.xlsx', icon: 'fa-file-excel', color: '#10b981', size: '890 KB', date: '2026-05-24', isImage: false },
        { name: 'background.webp', ext: '.webp', icon: 'fa-image', color: '#2563eb', size: '1.1 MB', date: '2026-05-24', isImage: true, imgSeed: 'aero5' },
        { name: '项目源码.zip', ext: '.zip', icon: 'fa-file-archive', color: '#78716c', size: '12.3 MB', date: '2026-05-23', isImage: false },
    ],
    image: [
        { name: 'screenshot_2026.png', ext: '.png', icon: 'fa-image', color: '#2563eb', size: '2.4 MB', date: '2026-05-28', isImage: true, imgSeed: 'aero1' },
        { name: '项目架构图.jpg', ext: '.jpg', icon: 'fa-image', color: '#2563eb', size: '1.8 MB', date: '2026-05-27', isImage: true, imgSeed: 'aero2' },
        { name: 'banner_design.png', ext: '.png', icon: 'fa-image', color: '#2563eb', size: '856 KB', date: '2026-05-26', isImage: true, imgSeed: 'aero3' },
        { name: 'avatar.png', ext: '.png', icon: 'fa-image', color: '#2563eb', size: '320 KB', date: '2026-05-25', isImage: true, imgSeed: 'aero4' },
        { name: 'background.webp', ext: '.webp', icon: 'fa-image', color: '#2563eb', size: '1.1 MB', date: '2026-05-24', isImage: true, imgSeed: 'aero5' },
        { name: 'logo.svg', ext: '.svg', icon: 'fa-image', color: '#2563eb', size: '12 KB', date: '2026-05-23', isImage: true, imgSeed: 'aero6' },
        { name: 'photo_001.gif', ext: '.gif', icon: 'fa-image', color: '#2563eb', size: '4.2 MB', date: '2026-05-22', isImage: true, imgSeed: 'aero7' },
        { name: 'icon_set.png', ext: '.png', icon: 'fa-image', color: '#2563eb', size: '680 KB', date: '2026-05-21', isImage: true, imgSeed: 'aero8' },
        { name: 'wallpaper.jpg', ext: '.jpg', icon: 'fa-image', color: '#2563eb', size: '3.5 MB', date: '2026-05-20', isImage: true, imgSeed: 'aero9' },
        { name: 'thumbnail_test.png', ext: '.png', icon: 'fa-image', color: '#2563eb', size: '156 KB', date: '2026-05-19', isImage: true, imgSeed: 'aero10' },
    ],
    document: [
        { name: 'WebServer项目.pdf', ext: '.pdf', icon: 'fa-file-pdf', color: '#ef4444', size: '3.2 MB', date: '2026-05-27', isImage: false },
        { name: '第一次上机报告.doc', ext: '.doc', icon: 'fa-file-word', color: '#0ea5e9', size: '1.2 MB', date: '2026-05-26', isImage: false },
        { name: '数据分析报表.xlsx', ext: '.xlsx', icon: 'fa-file-excel', color: '#10b981', size: '890 KB', date: '2026-05-24', isImage: false },
        { name: '产品需求文档.pdf', ext: '.pdf', icon: 'fa-file-pdf', color: '#ef4444', size: '5.1 MB', date: '2026-05-23', isImage: false },
        { name: '会议纪要.docx', ext: '.docx', icon: 'fa-file-word', color: '#0ea5e9', size: '456 KB', date: '2026-05-22', isImage: false },
        { name: '技术方案.pptx', ext: '.pptx', icon: 'fa-file-powerpoint', color: '#f97316', size: '8.7 MB', date: '2026-05-21', isImage: false },
        { name: 'API文档.pdf', ext: '.pdf', icon: 'fa-file-pdf', color: '#ef4444', size: '2.0 MB', date: '2026-05-20', isImage: false },
        { name: '财务报表Q1.xlsx', ext: '.xlsx', icon: 'fa-file-excel', color: '#10b981', size: '1.5 MB', date: '2026-05-19', isImage: false },
    ],
    video: [
        { name: 'demo_video.mp4', ext: '.mp4', icon: 'fa-file-video', color: '#8b5cf6', size: '45.6 MB', date: '2026-05-25', isImage: false },
        { name: 'tutorial.webm', ext: '.webm', icon: 'fa-file-video', color: '#7c3aed', size: '128 MB', date: '2026-05-22', isImage: false },
        { name: 'screen_record.mov', ext: '.mov', icon: 'fa-file-video', color: '#7c3aed', size: '67.3 MB', date: '2026-05-20', isImage: false },
    ],
    audio: [
        { name: 'podcast_ep01.mp3', ext: '.mp3', icon: 'fa-file-audio', color: '#ec4899', size: '23.4 MB', date: '2026-05-24', isImage: false },
    ],
    other: [
        { name: '项目源码.zip', ext: '.zip', icon: 'fa-file-archive', color: '#78716c', size: '12.3 MB', date: '2026-05-23', isImage: false },
        { name: 'config_backup.rar', ext: '.rar', icon: 'fa-file-archive', color: '#57534e', size: '4.5 MB', date: '2026-05-20', isImage: false },
    ]
};

function renderFiles(type) {
    const grid = document.getElementById('fileGrid');
    const files = FILES[type] || [];
    if (files.length === 0) {
        grid.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><p>该分类下暂无文件</p></div>';
        return;
    }
    grid.innerHTML = files.map(f => `
        <div class="file-card" style="border-top-color: ${f.color}">
            <div class="file-thumb">
                ${f.isImage
                    ? `<img src="https://picsum.photos/seed/${f.imgSeed}/300/200" alt="${f.name}" loading="lazy">`
                    : `<div class="file-icon-container">
                        <i class="fas ${f.icon} file-icon-large" style="color: ${f.color}"></i>
                        <span class="file-extension-tag" style="background-color: ${f.color}">${f.ext.slice(1)}</span>
                    </div>`
                }
            </div>
            <div class="file-info">
                <div class="file-name">${f.name}</div>
                <div class="file-meta">${f.size} · ${f.date}</div>
                <div class="file-actions">
                    <button class="action-btn"><i class="fas fa-link"></i> 链接</button>
                    <button class="action-btn"><i class="fas fa-font"></i> MD</button>
                    <button class="action-btn"><i class="fas fa-globe"></i> 公开</button>
                    <button class="action-btn danger"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>
        </div>
    `).join('');
}

function switchTab(type) {
    document.querySelectorAll('.type-tab').forEach(tab => tab.classList.remove('active'));
    document.querySelector(`.type-tab[data-type="${type}"]`).classList.add('active');
    renderFiles(type);
}

let isDark = false;
function toggleTheme() {
    isDark = !isDark;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
    document.getElementById('themeIcon').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
}

renderFiles('all');
</script>
</body>
</html>
